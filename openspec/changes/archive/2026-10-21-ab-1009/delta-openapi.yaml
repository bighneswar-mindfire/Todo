openapi: 3.1.0
info:
  title: Note Taking App API
  version: 0.9.0
  description: Delta for AB-1009. Adds per-note version history (list, read, restore). Every save of a note (create, changed PATCH, restore) records an immutable version. All endpoints require a Bearer access token. No new error code; existing note endpoints keep their contracts (POST /notes and PATCH /notes/{id} only gain the side effect of recording a version).
paths:
  /notes/{id}/versions:
    get:
      operationId: listNoteVersions
      summary: List the version history of an active note
      description: |
        Newest first (versionNumber descending). Items are summaries without content.
        A note created before versioning has an empty history until its first saved change.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/NoteId"
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: A page of version summaries (possibly empty)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NoteVersionList"
        "400":
          description: Malformed note id, or page/limit out of range (VALIDATION_ERROR)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing, invalid or expired access token (UNAUTHORIZED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Note does not exist, is owned by another user, or is soft deleted (NOT_FOUND)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalError"
  /notes/{id}/versions/{versionNumber}:
    get:
      operationId: getNoteVersion
      summary: Read one version of an active note, including content
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/NoteId"
        - $ref: "#/components/parameters/VersionNumber"
      responses:
        "200":
          description: The version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NoteVersion"
        "400":
          description: Malformed note id, or versionNumber not an integer >= 1 (VALIDATION_ERROR)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing, invalid or expired access token (UNAUTHORIZED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Note does not exist, is owned by another user or is soft deleted, or the note has no such version (NOT_FOUND)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalError"
  /notes/{id}/versions/{versionNumber}/restore:
    post:
      operationId: restoreNoteVersion
      summary: Restore a version onto the note
      description: |
        Sets the note's title and content to those of the chosen version, re-derives contentText and advances updatedAt.
        Records a new version with the next versionNumber; existing versions are never modified or removed.
        If the chosen version already equals the note's current title and content, nothing is written and no version is recorded.
        Tags and share links are unchanged. No request body.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/NoteId"
        - $ref: "#/components/parameters/VersionNumber"
      responses:
        "200":
          description: The note after the restore (same shape as GET /notes/{id})
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Note"
        "400":
          description: Malformed note id, or versionNumber not an integer >= 1 (VALIDATION_ERROR)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing, invalid or expired access token (UNAUTHORIZED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Note does not exist, is owned by another user or is soft deleted, or the note has no such version (NOT_FOUND). The note is unchanged.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalError"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    NoteId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    VersionNumber:
      name: versionNumber
      in: path
      required: true
      description: Per-note sequence number, starting at 1
      schema:
        type: integer
        minimum: 1
  responses:
    InternalError:
      description: Unexpected server error (INTERNAL_ERROR)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    TipTapDoc:
      type: object
      description: TipTap JSON document
      required: [type]
      properties:
        type:
          type: string
          const: doc
        content:
          type: array
          items:
            type: object
      additionalProperties: true
    NoteVersionSummary:
      type: object
      required: [id, versionNumber, title, excerpt, createdAt]
      properties:
        id:
          type: string
          format: uuid
        versionNumber:
          type: integer
          minimum: 1
        title:
          type: string
        excerpt:
          type: string
          maxLength: 200
          description: First 200 characters of the version's plain text
        createdAt:
          type: string
          format: date-time
    NoteVersionList:
      type: object
      required: [items, page, limit, total]
      properties:
        items:
          type: array
          description: Ordered by versionNumber descending
          items:
            $ref: "#/components/schemas/NoteVersionSummary"
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
    NoteVersion:
      type: object
      required: [id, noteId, versionNumber, title, content, createdAt]
      properties:
        id:
          type: string
          format: uuid
        noteId:
          type: string
          format: uuid
        versionNumber:
          type: integer
          minimum: 1
        title:
          type: string
        content:
          $ref: "#/components/schemas/TipTapDoc"
        createdAt:
          type: string
          format: date-time
    TagRef:
      type: object
      required: [id, name, color]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        color:
          type: string
    Note:
      type: object
      required: [id, title, content, tags, createdAt, updatedAt, deletedAt]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        content:
          $ref: "#/components/schemas/TipTapDoc"
        tags:
          type: array
          items:
            $ref: "#/components/schemas/TagRef"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        deletedAt:
          type: [string, "null"]
          format: date-time
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: Unchanged from AB-1008. No new error code.
              enum:
                - VALIDATION_ERROR
                - EMAIL_TAKEN
                - INVALID_CREDENTIALS
                - INVALID_REFRESH_TOKEN
                - INVALID_OTP
                - UNAUTHORIZED
                - NOT_FOUND
                - TAG_NAME_TAKEN
                - INTERNAL_ERROR
            message:
              type: string
            details:
              type: array
              description: Present on VALIDATION_ERROR; one entry per invalid field
              items:
                type: object
                required: [field, message]
                properties:
                  field:
                    type: string
                  message:
                    type: string
