openapi: 3.1.0
info:
  title: Note Taking App API
  version: 0.18.0
  description: |
    Delta for AB-1018 (frontend tag creation in the note editor). This ticket adds NO new endpoints and changes NO existing request, response or status code, so `paths` is intentionally empty. The backend contract is the one fixed by AB-1006 (create tag, attach tag).

    The frontend consumes the endpoints listed under `x-frontend-consumes`, which also records how the UI must react to each status code. Tests assert these reactions. The error body is always `{ error: { code, message, details? } }`. Requests go through the `/api` base path, unchanged from AB-1010. A 401 on a bearer call follows the AB-1010 refresh flow: one refresh, one retry, and if refresh is rejected the session is cleared and the user is sent to /login.
paths: {}
x-frontend-consumes:
  /tags:
    post:
      operationId: createTag
      auth: bearer
      request: Body `{ name, color }` conforming to `createTagRequestSchema` from `@todo/shared` (name trimmed, 1 to 50 characters; color `#RRGGBB`, the UI always sends one). Validated in the browser first; an invalid name sends nothing.
      response: Tag from `@todo/shared` (`id`, `name`, `color`, `createdAt`).
      onStatus:
        "201": Attach the new tag to the open note (PUT below), then show it pressed, close the form, refresh the tags and notes-list queries.
        "201 (body fails schema)": Treated as a failure. Show the generic alert; the form stays open. The tag may exist on the server; the tags list is not refreshed by this path.
        "400": VALIDATION_ERROR. Not expected, the UI validates first. Show the generic alert; the form stays open.
        "401": UNAUTHORIZED. Refresh once and retry (AB-1010).
        "409": TAG_NAME_TAKEN. Show "You already have a tag with that name" on the name field; no attach request.
        "500": INTERNAL_ERROR. Show the generic alert; the form stays open with the typed values.
        "network failure": NETWORK_ERROR. Same as 500.
  /notes/{id}/tags/{tagId}:
    put:
      operationId: attachTag
      auth: bearer
      request: No body. Called once, right after a successful create, for the tag that was just created and the open note.
      response: 204 with no body.
      onStatus:
        "204": The new tag is shown pressed; the note's cached tags include it.
        "400": VALIDATION_ERROR. Not expected (both ids come from the API). Treated like 500.
        "401": UNAUTHORIZED. Refresh once and retry (AB-1010).
        "404": NOT_FOUND (note deleted or not owned). The tag exists, so refresh the tags list, show it unpressed and show "Tag created, but it could not be added to this note. Press it to try again".
        "500": INTERNAL_ERROR. Same as 404.
        "network failure": NETWORK_ERROR. Same as 404.
