openapi: 3.1.0
info:
  title: Note Taking App API
  version: 0.13.0
  description: |
    Delta for AB-1013 (frontend search UI). This ticket adds NO new endpoints and changes NO existing request, response or status code, so `paths` is intentionally empty. The backend contract is the one fixed by AB-1007 (`GET /search`) and AB-1006 (`GET /tags`).

    The frontend consumes the endpoints listed under `x-frontend-consumes`, which also records how the UI must react to each status code. Tests assert these reactions. The error body is always `{ error: { code, message, details? } }`. Requests go through the `/api` base path, unchanged from AB-1010. A 401 on any call follows the AB-1010 refresh flow: one refresh, one retry, and if refresh is rejected the session is cleared and the user is sent to /login.
paths: {}
x-frontend-consumes:
  /search:
    get:
      operationId: searchNotes
      auth: bearer
      request: SearchQuery from `@todo/shared` (`q` trimmed 1..200, `page` >= 1, `limit` 1..100, optional `tagId` uuid). The UI sends `q` trimmed, `page`, `limit=20`, and `tagId` only when a tag is selected. It never sends a blank or over-length `q`.
      response: SearchResponse from `@todo/shared` (`items` of SearchResult = NoteSummary + `rank` + `highlight: { title, snippet }`, plus `page`, `limit`, `total`). `highlight` strings are HTML-escaped by the server (`& < > " '`) and contain only `<mark>` and `</mark>` as markup; the UI renders them without `innerHTML`.
      onStatus:
        "200": Render the results, or "No results" when `items` is empty.
        "200 (body fails schema)": Treated as a failure. Show the error alert with Retry.
        "400": VALIDATION_ERROR. Not expected (the UI validates first). Show the error alert with Retry.
        "401": UNAUTHORIZED. Refresh once and retry (AB-1010).
        "404": NOT_FOUND for an unknown or foreign `tagId`. Show "That tag no longer exists" with a button that clears the tag filter.
        "500": INTERNAL_ERROR. Show the error alert with Retry.
        "network failure": NETWORK_ERROR. Same as 500.
  /tags:
    get:
      operationId: listTags
      auth: bearer
      response: TagListResponse from `@todo/shared`. Reused unchanged from AB-1011 for the tag filter.
      onStatus:
        "200": Render the tag filter buttons.
        "401": UNAUTHORIZED. Refresh once and retry (AB-1010).
        "500": INTERNAL_ERROR. The tag filter shows "Couldn't load tags" with Retry; results are unaffected.
        "network failure": NETWORK_ERROR. Same as 500.
