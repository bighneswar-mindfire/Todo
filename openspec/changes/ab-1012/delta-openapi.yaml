openapi: 3.1.0
info:
  title: Note Taking App API
  version: 0.12.0
  description: |
    Delta for AB-1012 (frontend note editor). This ticket adds NO new endpoints and changes NO existing request, response or status code, so `paths` is intentionally empty. The backend contract is the one fixed by AB-1004 (`POST /notes`, `GET /notes/{id}`, `PATCH /notes/{id}`, `DELETE /notes/{id}`) and AB-1006 (`GET /tags`, `PUT` and `DELETE /notes/{id}/tags/{tagId}`).

    The frontend consumes the endpoints listed under `x-frontend-consumes`, which also records how the UI must react to each status code. Tests assert these reactions. The error body is always `{ error: { code, message, details? } }`. Requests go through the `/api` base path (Vite proxy in development), unchanged from AB-1010. A 401 on any call follows the AB-1010 refresh flow: one refresh, one retry, and if refresh is rejected the session is cleared and the user is sent to /login.
paths: {}
x-frontend-consumes:
  /notes:
    post:
      operationId: createNote
      auth: bearer
      request: CreateNoteRequest from `@todo/shared` (`title` trimmed 1..200, `content` TipTap doc). The UI always sends both, with the title trimmed.
      response: Note from `@todo/shared` (`id`, `title`, `content`, `tags`, `createdAt`, `updatedAt`, `deletedAt`).
      onStatus:
        "201": Replace the URL with /notes/{id}, show the note as saved, invalidate the notes list and tags queries.
        "200/201 (body fails schema)": Treated as a failure. Show the save alert, keep the edits.
        "400": VALIDATION_ERROR. Show the `details` message for `title` under the title input when present, otherwise the save alert. Keep the edits.
        "401": UNAUTHORIZED. Refresh once and retry (AB-1010).
        "500": INTERNAL_ERROR. Show the save alert, keep the edits, keep Save enabled.
        "network failure": NETWORK_ERROR. Same as 500.
  /notes/{id}:
    get:
      operationId: getNote
      auth: bearer
      path: id is the route param, passed through unchanged.
      response: Note from `@todo/shared`.
      onStatus:
        "200": Fill the title input and the TipTap editor from `title` and `content`. Mark the page clean.
        "200 (body fails schema)": Treated as a failure. Show the load alert with Retry.
        "400": VALIDATION_ERROR for a malformed id. Show "Note not found" (the user typed a bad URL; there is nothing to retry).
        "401": UNAUTHORIZED. Refresh once and retry (AB-1010).
        "404": NOT_FOUND (unknown, soft-deleted or someone else's note). Show "Note not found" with a link to /.
        "500": INTERNAL_ERROR. Show the load alert with Retry.
        "network failure": NETWORK_ERROR. Same as 500.
    patch:
      operationId: updateNote
      auth: bearer
      request: UpdateNoteRequest from `@todo/shared`. The UI sends only the changed fields among `title` and `content`, and never sends an empty object (Save is disabled when nothing changed).
      response: Note from `@todo/shared`.
      onStatus:
        "200": Use the returned note as the new baseline, show "Saved", invalidate the notes list and tags queries.
        "200 (body fails schema)": Treated as a failure. Show the save alert, keep the edits.
        "400": VALIDATION_ERROR. Show the `details` message for `title` under the title input when present, otherwise the save alert. Keep the edits.
        "401": UNAUTHORIZED. Refresh once and retry (AB-1010).
        "404": NOT_FOUND (the note was deleted or is not the caller's). Show "Note not found".
        "500": INTERNAL_ERROR. Show the save alert, keep the edits, keep Save enabled.
        "network failure": NETWORK_ERROR. Same as 500.
    delete:
      operationId: deleteNote
      auth: bearer
      semantics: Soft delete. The API sets `deletedAt`; the UI never claims permanent removal.
      onStatus:
        "204": Navigate to /, skip the unsaved-changes guard, invalidate the notes list and tags queries.
        "401": UNAUTHORIZED. Refresh once and retry (AB-1010).
        "404": NOT_FOUND (already deleted or not the caller's). Navigate to / as if it had succeeded, and invalidate the notes list.
        "500": INTERNAL_ERROR. Keep the confirmation dialog open with an alert.
        "network failure": NETWORK_ERROR. Same as 500.
  /notes/{id}/tags/{tagId}:
    put:
      operationId: attachTag
      auth: bearer
      semantics: Idempotent attach.
      onStatus:
        "204": Mark the tag button pressed, invalidate the notes list and tags queries.
        "400": VALIDATION_ERROR. Not expected (ids come from loaded data). Shown as the tag alert.
        "401": UNAUTHORIZED. Refresh once and retry (AB-1010).
        "404": NOT_FOUND (note or tag is gone). Re-fetch tags and show "That tag no longer exists" (or the not-found state if the note itself is gone on the next load).
        "500": INTERNAL_ERROR. Keep the previous button state and show the tag alert.
        "network failure": NETWORK_ERROR. Same as 500.
    delete:
      operationId: detachTag
      auth: bearer
      semantics: Idempotent detach. The tag itself is not deleted.
      onStatus:
        "204": Mark the tag button unpressed, invalidate the notes list and tags queries.
        "400": VALIDATION_ERROR. Same as attachTag.
        "401": UNAUTHORIZED. Refresh once and retry (AB-1010).
        "404": NOT_FOUND. Same as attachTag.
        "500": INTERNAL_ERROR. Keep the previous button state and show the tag alert.
        "network failure": NETWORK_ERROR. Same as 500.
  /tags:
    get:
      operationId: listTags
      auth: bearer
      response: TagListResponse from `@todo/shared` (`items` of tag with `id`, `name`, `color`, `createdAt`, `noteCount`; ordered by name, not paginated). Reused unchanged from AB-1011.
      onStatus:
        "200": Render one toggle button per tag, or "No tags yet" when empty.
        "401": UNAUTHORIZED. Refresh once and retry (AB-1010).
        "500": INTERNAL_ERROR. The Tags group shows "Couldn't load tags" with Retry. The rest of the editor is unaffected.
        "network failure": NETWORK_ERROR. Same as 500.
